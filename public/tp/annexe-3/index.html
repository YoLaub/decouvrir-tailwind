<!doctype html>
<html lang="fr" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annexe 3 · la même charte en Bootstrap</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    /* La charte, version Bootstrap : des variables, mais en rgb (oklch(0.55 0.20 25) donne environ 204, 39, 46). */
    :root {
      --bs-primary: #cc272e;
      --bs-primary-rgb: 204, 39, 46;
      --bs-body-font-family: "Fraunces", serif;
      --bs-border-radius: 0;
      --bs-border-radius-sm: 0;
      --bs-border-radius-lg: 0;
    }
    .btn-primary {
      --bs-btn-bg: #cc272e;
      --bs-btn-border-color: #cc272e;
      --bs-btn-hover-bg: #a81f25;
      --bs-btn-hover-border-color: #a81f25;
      --bs-btn-active-bg: #8c1a1f;
      --bs-btn-active-border-color: #8c1a1f;
    }
  </style>
</head>
<body>
<div class="p-4 bg-body text-body" style="min-height: 10rem">
  <h1 class="h3 fw-bold text-primary">Agence</h1>
  <p class="mt-2">Une page de test pour la charte.</p>
  <button class="btn btn-primary mt-3">Contact</button>
  <button class="btn btn-outline-secondary mt-3" onclick="
    const h = document.documentElement;
    h.dataset.bsTheme = h.dataset.bsTheme === 'dark' ? 'light' : 'dark';">Mode sombre</button>
</div>
</body>
</html>
