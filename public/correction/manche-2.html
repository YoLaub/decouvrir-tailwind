<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manche 2 · correction Tailwind</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
  <style type="text/tailwindcss">
    @import "tailwindcss";

    /* 1. Les tokens : chaque valeur de la charte est écrite une seule fois, ici. */
    @theme {
      --color-brand: var(--color-blue-600);
      --color-brand-dark: var(--color-blue-700);
      --color-brand-ring: var(--color-blue-300);
      --radius-control: var(--radius-md);
    }

    /* 2. Les composants : ils lisent les tokens, ils n'écrivent aucune couleur en dur. */
    @utility btn {
      border-radius: var(--radius-control);
      background-color: var(--color-brand);
      color: white;
      &:hover { background-color: var(--color-brand-dark); }
      &:focus { outline: none; box-shadow: 0 0 0 4px var(--color-brand-ring); }
    }

    @utility field {
      width: 100%;
      border-radius: var(--radius-control);
      border: 1px solid var(--color-gray-300);
      padding-inline: --spacing(3);
      padding-block: --spacing(2);
      &:focus { border-color: var(--color-brand); outline: none; box-shadow: 0 0 0 4px var(--color-brand-ring); }
    }
  </style>
</head>
<body>
<nav class="bg-gray-100">
  <div class="container mx-auto flex flex-col px-4 py-2 md:flex-row md:items-center">
    <a class="py-2 text-xl text-gray-900" href="#">Agence</a>
    <ul class="flex flex-col md:ml-auto md:flex-row md:gap-2">
      <li><a class="block px-2 py-2 text-gray-600 hover:text-gray-900" href="#">Accueil</a></li>
      <li><a class="block px-2 py-2 text-gray-600 hover:text-gray-900" href="#">Services</a></li>
      <li><a class="block px-2 py-2 text-gray-600 hover:text-gray-900" href="#">Contact</a></li>
    </ul>
  </div>
</nav>

<header class="container mx-auto px-4 py-12 text-center">
  <h1 class="text-5xl font-light">Des sites qui vous ressemblent</h1>
  <p class="mt-4 text-xl font-light">Conception, développement, accompagnement.</p>
  <a class="btn mt-6 inline-block px-6 py-3 text-xl" href="#">Parlons de votre projet</a>
</header>

<form class="container mx-auto px-4 py-12">
  <div class="mb-4">
    <label class="mb-2 block" for="nom">Nom</label>
    <input class="field" id="nom">
  </div>
  <div class="mb-4">
    <label class="mb-2 block" for="email">Email</label>
    <input class="field" id="email" type="email">
  </div>
  <div class="mb-4">
    <label class="mb-2 block" for="message">Message</label>
    <textarea class="field" id="message" rows="4"></textarea>
  </div>
  <button class="btn px-4 py-2">Envoyer</button>
</form>

<!--
  Étape 3 : si la couleur de marque change, il y a 1 seul endroit à modifier : --color-brand dans @theme
  (et ses deux variantes). Avant l'extraction, il fallait corriger 2 boutons et 3 champs, à plusieurs endroits chacun.
-->
</body>
</html>
